# 원본 컬럼명 → 표준 컬럼 (8.2). 컬럼명은 공백·각주표시(1), *)를 지운 뒤 정규식(re.search)으로 맞춘다.
# 위에서부터 먼저 맞는 표준 컬럼 하나에만 배정하고, 한 표에서 같은 표준 컬럼이 둘이면 앞 칸을 쓴다.
# 새 이름은 data/output/unmapped_columns.csv 를 보고 여기에 추가한다.
skip_table: ["예정가격", "계약율", "계약금액"]   # 계약 현황 등 업무추진비 집행내역이 아닌 표
exec_date: ["일자", "일시", "날짜", "^(사용|집행|지급|결제|승인|지출)?일$"]
exec_time: ["시간"]
vendor_address: ["주소", "소재지"]
amount: ["사용금액", "사용액", "집행금액", "집행액", "지출금액", "지출액", "결제금액", "결제액", "금회지급액", "지급금액", "거래금액",
         "^금액", "^지급액", "^\\(?원\\)?$"]
headcount: ["인원"]
vendor_raw: ["장소", "사용처", "거래처", "가맹점", "상호", "업소", "업체", "채주", "지출처", "집행처"]
attendees: ["대상", "참석"]            # 명단일 수 있음 → 저장하지 않고 인원수('N명')만 뽑는다(8.5)
purpose: ["목적", "내역", "내용", "적요", "건명"]
department: ["부서", "기관명", "소속", "학교명"]
executor_position: ["직위", "직급", "사용자", "집행자"]
payment_method: ["방법", "결제", "결재", "카드"]
ignore: ["^연번$", "^순(번)?$", "^번호$", "^no\\.?$", "비목", "구분", "비고", "잔액", "기지급", "예산", "과목", "종류", "업종",
         "^제목$", "^-$", "회계연도", "처리사항", "^col\\d+$"]
