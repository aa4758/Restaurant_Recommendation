[project]
name = "expense-collector"
version = "0.1.0"
description = "공공기관 업무추진비 집행내역 수집·통합 (찐맛 데이터 파이프라인 H)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pyarrow>=15",
  "pdfplumber>=0.11",
  "pyyaml>=6.0",
  "typer>=0.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 등급 B 사이트 / 스캔 PDF / HWP 가 실제로 확인된 뒤 설치
browser = ["playwright>=1.44"]
ocr = ["pytesseract>=0.3"]
hwp = ["pyhwp>=0.1b15"]
camelot = ["camelot-py>=0.11"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
