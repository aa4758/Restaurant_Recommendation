# 업무추진비 수집기 설정 — 코드에 상수로 박지 말고 여기서 읽는다.
period:
  start: "2024-11-01"
  end: "2026-10-31"

pilot:
  per_type: 3          # 유형별 파일럿 기관 수 (총 10~15곳)

http:
  min_interval_sec: 2.0     # 같은 도메인 요청 간격(최소)
  max_concurrency_per_domain: 1
  timeout_sec: 30
  retries: 4                # 지수 백오프
  # 연락처는 반드시 실제 값으로 바꿀 것 (9. 크롤링 윤리)
  user_agent: "JJINMAT-ExpenseCollector/0.1 (+contact: CHANGE_ME@example.com)"
  respect_robots: true

paths:
  state_db: data/state.db
  raw: data/raw
  parsed: data/parsed
  output: data/output
  logs: logs

parse:
  csv_encodings: ["utf-8-sig", "cp949"]
  ocr_engine: tesseract     # tesseract | paddleocr
  low_confidence: 0.7

# 찐맛(JJINMAT) 백엔드로 넘길 export (CLAUDE.md 13절)
jjinmat_export:
  path: data/output/gov_expense_for_jjinmat.csv
  categories: [restaurant]  # cafe 포함 여부는 기획 결정 후
