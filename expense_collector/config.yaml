# 업무추진비 수집기 설정 — 코드에 상수로 박지 말고 여기서 읽는다.
period:
  start: "2024-11-01"
  end: "2026-10-31"

pilot:
  per_type: 3          # 유형별 파일럿 기관 수 (총 10~15곳)
  # P2 파일럿 14곳 (2026-10-27). 근거: 공공데이터포털 데이터 有/無, 서울/비서울, 이미 아는 결과(관악=게시판 통과) 섞기
  institutions:
    - "6110000"   # 서울특별시 — DATAGOKR csv(15124812) + 열린데이터광장
    - "6410000"   # 경기도 — DATAGOKR '통합홈페이지 집행내역'
    - "6260000"   # 부산광역시 — DATAGOKR 없음, 게시판만
    - "3200000"   # 서울 관악구 — 25개 구 시범에서 게시판 통과(HTML) → 검증용
    - "3470000"   # 대구 달서구 — DATAGOKR xls + 비서울
    - "5020000"   # 경북 포항시 — DATAGOKR 없음, 홈페이지 robots 비허용(→ 등급 C 처리 확인)
    - "7010000"   # 서울특별시교육청
    - "7530000"   # 경기도교육청
    - "7021000"   # 서울 동부교육지원청
    - "7541000"   # 경기 수원교육지원청
    - "1250000"   # 통일부 — DATAGOKR csv + 게시판
    - "1741000"   # 행정안전부 — 지방재정365(예산, 집행내역 아님) 구분 확인
    - "1210000"   # 국세청
    - "1040000"   # 감사원 (기타 범위)

http:
  min_interval_sec: 3.0     # 같은 도메인 요청 간격(최소, 01 결정 ≥3초)
  max_concurrency_per_domain: 1
  timeout_sec: 30
  retries: 4                # 지수 백오프
  # 연락처는 반드시 실제 값으로 바꿀 것 (9. 크롤링 윤리)
  user_agent: "JJINMAT-ExpenseCollector/0.1 (+contact: groovechoi0119@gmail.com)"
  respect_robots: true

paths:
  state_db: data/state.db
  raw: data/raw
  parsed: data/parsed
  output: data/output
  logs: logs

parse:
  csv_encodings: ["utf-8-sig", "cp949"]
  ocr_engine: tesseract     # tesseract | paddleocr
  low_confidence: 0.7

# 찐맛(JJINMAT) 백엔드로 넘길 export (CLAUDE.md 13절)
jjinmat_export:
  path: data/output/gov_expense_for_jjinmat.csv
  categories: [restaurant]  # D-2: 카페 제외(2026-10-26 승인)

